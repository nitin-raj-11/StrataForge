spring.application.name=strataforge
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/strataforge}
spring.datasource.username=${DATABASE_USERNAME:strataforge}
spring.datasource.password=${DATABASE_PASSWORD:strataforge_pass_dev_only}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

strataforge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional SMTP configuration for password reset emails.
# In production, set these environment variables rather than committing credentials.

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
# Clerk authentication
clerk.secret-key=${CLERK_SECRET_KEY:}
clerk.issuer-url=${CLERK_ISSUER_URL:}
clerk.jwks-url=${CLERK_JWKS_URL:}

