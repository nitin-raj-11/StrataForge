version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: strataforge-db
    environment:
      POSTGRES_USER: strataforge
      POSTGRES_PASSWORD: strataforge_pass
      POSTGRES_DB: strataforge
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
volumes:
  timescale_data: